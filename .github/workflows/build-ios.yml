name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodule repo
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: "tst/googletest/"
          ref: "release-1.12.1"

      - name: Install Qt iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'ios'
          modules: 'qtcharts qtnetworkauth'
          dir: '${{ github.workspace }}/output/ios/'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-ios'

      - name: Fix Qt tools and configuration
        run: |
          find ${{ github.workspace }}/output/ios/ -name 'devices.py' -exec sed -i '' 's/\/usr\/bin\/python/\/usr\/bin\/python3/g' {} \;
          find ./ -name 'qdomyos-zwift-lib.pro' -exec sed -i '' 's/TARGET = qdomyos-zwift/TARGET = qdomyoszwift/g' {} \;

      - name: Patch Qt for Bluetooth
        run: cp qt-patches/ios/5.15.2/binary/*.* ${{ github.workspace }}/output/ios/Qt/5.15.2/ios/lib/

      - name: Setup ccache
        run: |
          brew install ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=base_dir=${{ github.workspace }}
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,file_macro,clang_index_store
          ccache --zero-stats
          mkdir -p /tmp/ccache-wrappers
          printf '#!/bin/bash\nexec /opt/homebrew/bin/ccache clang "$@"\n' > /tmp/ccache-wrappers/clang
          printf '#!/bin/bash\nexec /opt/homebrew/bin/ccache clang++ "$@"\n' > /tmp/ccache-wrappers/clang++
          chmod +x /tmp/ccache-wrappers/clang /tmp/ccache-wrappers/clang++

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/*.pro') }}
          restore-keys: |
            ccache-ios-

      - name: Generate Secrets & Build
        run: |
          cd src
          echo "#define STRAVA_SECRET_KEY \"\"" > secret.h
          echo "#define PELOTON_SECRET_KEY \"\"" >> secret.h
          echo "#define SMTP_USERNAME \"\"" >> secret.h
          echo "#define SMTP_PASSWORD \"\"" >> secret.h
          echo "#define SMTP_SERVER \"\"" >> secret.h
          echo "#define INTERVALSICU_CLIENT_ID \"\"" >> secret.h
          echo "#define INTERVALSICU_CLIENT_SECRET \"\"" >> secret.h
          echo "" >> inner_templates/googlemaps/cesium-key.js
          cd ..
          
          export PATH="${{ github.workspace }}/output/ios/Qt/5.15.2/ios/bin:$PATH"
          qmake CONFIG+=release CONFIG+=iphoneos qdomyos-zwift.pro
          make -j$(sysctl -n hw.ncpu)

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find . -name "*.app" -type d | grep -E "Release-iphoneos|release-iphoneos|\.app$" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Packaging application found at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r qz-ios-device.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qz-ios-device-ipa
          path: qz-ios-device.ipa
